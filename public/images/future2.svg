<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect width="300" height="100" fill="#87CEEB"/>
  
  <!-- Ground -->
  <rect y="100" width="300" height="200" fill="#90EE90"/>
  
  <!-- Garden path -->
  <ellipse cx="150" cy="200" rx="80" ry="20" fill="#DEB887"/>
  
  <!-- Stick figure couple gardening -->
  <!-- Person 1 (kneeling, planting) -->
  <circle cx="100" cy="180" r="8" fill="#FFDBAC" stroke="#000" stroke-width="1"/>
  <line x1="100" y1="188" x2="100" y2="210" stroke="#000" stroke-width="2"/>
  <line x1="100" y1="195" x2="85" y2="200" stroke="#000" stroke-width="2"/>
  <line x1="100" y1="195" x2="115" y2="205" stroke="#000" stroke-width="2"/>
  <line x1="100" y1="210" x2="90" y2="225" stroke="#000" stroke-width="2"/>
  <line x1="100" y1="210" x2="110" y2="225" stroke="#000" stroke-width="2"/>
  <!-- Hair -->
  <path d="M 92 175 Q 100 165 108 175" fill="#8B4513" stroke="#000" stroke-width="1"/>
  <!-- Smile -->
  <path d="M 96 182 Q 100 185 104 182" fill="none" stroke="#000" stroke-width="1"/>
  
  <!-- Person 2 (standing, watering) -->
  <circle cx="200" cy="170" r="8" fill="#FFDBAC" stroke="#000" stroke-width="1"/>
  <line x1="200" y1="178" x2="200" y2="210" stroke="#000" stroke-width="2"/>
  <line x1="200" y1="190" x2="185" y2="185" stroke="#000" stroke-width="2"/>
  <line x1="200" y1="190" x2="220" y2="195" stroke="#000" stroke-width="2"/>
  <line x1="200" y1="210" x2="190" y2="230" stroke="#000" stroke-width="2"/>
  <line x1="200" y1="210" x2="210" y2="230" stroke="#000" stroke-width="2"/>
  <!-- Hair -->
  <path d="M 192 165 Q 200 155 208 165" fill="#654321" stroke="#000" stroke-width="1"/>
  <!-- Smile -->
  <path d="M 196 172 Q 200 175 204 172" fill="none" stroke="#000" stroke-width="1"/>
  
  <!-- Watering can -->
  <ellipse cx="225" cy="195" rx="8" ry="5" fill="#4682B4"/>
  <rect x="220" y="192" width="3" height="6" fill="#4682B4"/>
  <line x1="228" y1="190" x2="235" y2="185" stroke="#4682B4" stroke-width="2"/>
  
  <!-- Water drops -->
  <circle cx="180" cy="200" r="1" fill="#4682B4"/>
  <circle cx="175" cy="205" r="1" fill="#4682B4"/>
  <circle cx="185" cy="208" r="1" fill="#4682B4"/>
  
  <!-- Tiger Lilies -->
  <!-- Lily 1 -->
  <line x1="60" y1="250" x2="60" y2="200" stroke="#228B22" stroke-width="3"/>
  <polygon points="60,200 55,185 50,200 45,185 50,200 55,185 65,185 70,200 65,185 60,200" fill="#FF6347"/>
  <circle cx="60" cy="190" r="3" fill="#FFD700"/>
  <polygon points="55,185 50,180 45,185" fill="#FF4500"/>
  <polygon points="65,185 70,180 75,185" fill="#FF4500"/>
  <polygon points="60,185 55,180 50,185" fill="#FF4500"/>
  
  <!-- Lily 2 -->
  <line x1="120" y1="260" x2="120" y2="210" stroke="#228B22" stroke-width="3"/>
  <polygon points="120,210 115,195 110,210 105,195 110,210 115,195 125,195 130,210 125,195 120,210" fill="#FF6347"/>
  <circle cx="120" cy="200" r="3" fill="#FFD700"/>
  <polygon points="115,195 110,190 105,195" fill="#FF4500"/>
  <polygon points="125,195 130,190 135,195" fill="#FF4500"/>
  
  <!-- Lily 3 -->
  <line x1="240" y1="255" x2="240" y2="205" stroke="#228B22" stroke-width="3"/>
  <polygon points="240,205 235,190 230,205 225,190 230,205 235,190 245,190 250,205 245,190 240,205" fill="#FF6347"/>
  <circle cx="240" cy="195" r="3" fill="#FFD700"/>
  <polygon points="235,190 230,185 225,190" fill="#FF4500"/>
  <polygon points="245,190 250,185 255,190" fill="#FF4500"/>
  
  <!-- Small flowers -->
  <circle cx="80" cy="240" r="4" fill="#FF69B4"/>
  <circle cx="160" cy="245" r="4" fill="#DDA0DD"/>
  <circle cx="220" cy="235" r="4" fill="#FF69B4"/>
  
  <!-- Leaves -->
  <ellipse cx="50" cy="220" rx="8" ry="3" fill="#228B22" transform="rotate(45 50 220)"/>
  <ellipse cx="130" cy="230" rx="8" ry="3" fill="#228B22" transform="rotate(-30 130 230)"/>
  <ellipse cx="250" cy="225" rx="8" ry="3" fill="#228B22" transform="rotate(60 250 225)"/>
  
  <!-- Garden tools -->
  <!-- Shovel -->
  <line x1="110" y1="220" x2="125" y2="235" stroke="#8B4513" stroke-width="2"/>
  <ellipse cx="127" cy="237" rx="3" ry="6" fill="#696969" transform="rotate(45 127 237)"/>
  
  <!-- Sun -->
  <circle cx="50" cy="40" r="12" fill="#FFD700"/>
  <line x1="50" y1="20" x2="50" y2="12" stroke="#FFD700" stroke-width="2"/>
  <line x1="70" y1="40" x2="78" y2="40" stroke="#FFD700" stroke-width="2"/>
  <line x1="50" y1="60" x2="50" y2="68" stroke="#FFD700" stroke-width="2"/>
  <line x1="30" y1="40" x2="22" y2="40" stroke="#FFD700" stroke-width="2"/>
  <line x1="65" y1="25" x2="71" y2="19" stroke="#FFD700" stroke-width="2"/>
  <line x1="65" y1="55" x2="71" y2="61" stroke="#FFD700" stroke-width="2"/>
  <line x1="35" y1="55" x2="29" y2="61" stroke="#FFD700" stroke-width="2"/>
  <line x1="35" y1="25" x2="29" y2="19" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Clouds -->
  <circle cx="150" cy="30" r="8" fill="#FFFFFF"/>
  <circle cx="160" cy="30" r="10" fill="#FFFFFF"/>
  <circle cx="170" cy="30" r="8" fill="#FFFFFF"/>
  
  <circle cx="250" cy="25" r="6" fill="#FFFFFF"/>
  <circle cx="258" cy="25" r="8" fill="#FFFFFF"/>
  <circle cx="266" cy="25" r="6" fill="#FFFFFF"/>
</svg>
