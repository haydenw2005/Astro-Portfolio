<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect width="300" height="150" fill="#87CEEB"/>
  
  <!-- Ocean -->
  <rect y="150" width="300" height="80" fill="#4682B4"/>
  
  <!-- Beach sand -->
  <rect y="230" width="300" height="70" fill="#F4A460"/>
  
  <!-- Road -->
  <rect y="270" width="300" height="30" fill="#696969"/>
  <line x1="0" y1="285" x2="300" y2="285" stroke="#FFFF00" stroke-width="2" stroke-dasharray="10,10"/>
  
  <!-- Car -->
  <rect x="120" y="260" width="60" height="20" fill="#FF4500" rx="5"/>
  <rect x="125" y="255" width="50" height="15" fill="#87CEEB" rx="3"/>
  <!-- Wheels -->
  <circle cx="135" cy="285" r="6" fill="#000"/>
  <circle cx="135" cy="285" r="3" fill="#C0C0C0"/>
  <circle cx="165" cy="285" r="6" fill="#000"/>
  <circle cx="165" cy="285" r="3" fill="#C0C0C0"/>
  <!-- Headlights -->
  <circle cx="182" cy="270" r="2" fill="#FFFF00"/>
  <circle cx="182" cy="275" r="2" fill="#FFFF00"/>
  
  <!-- Stick figures in car -->
  <!-- Driver (left) -->
  <circle cx="135" cy="248" r="4" fill="#FFDBAC" stroke="#000" stroke-width="0.5"/>
  <line x1="135" y1="252" x2="135" y2="260" stroke="#000" stroke-width="1"/>
  <line x1="135" y1="255" x2="130" y2="258" stroke="#000" stroke-width="1"/>
  <!-- Hair -->
  <path d="M 131 245 Q 135 242 139 245" fill="#8B4513" stroke="#000" stroke-width="0.5"/>
  <!-- Smile -->
  <path d="M 133 249 Q 135 251 137 249" fill="none" stroke="#000" stroke-width="0.5"/>
  
  <!-- Passenger (right) -->
  <circle cx="155" cy="248" r="4" fill="#FFDBAC" stroke="#000" stroke-width="0.5"/>
  <line x1="155" y1="252" x2="155" y2="260" stroke="#000" stroke-width="1"/>
  <line x1="155" y1="255" x2="160" y2="258" stroke="#000" stroke-width="1"/>
  <!-- Hair -->
  <path d="M 151 245 Q 155 242 159 245" fill="#654321" stroke="#000" stroke-width="0.5"/>
  <!-- Smile -->
  <path d="M 153 249 Q 155 251 157 249" fill="none" stroke="#000" stroke-width="0.5"/>
  
  <!-- Luggage on roof -->
  <rect x="130" y="240" width="15" height="8" fill="#8B4513" rx="2"/>
  <rect x="145" y="242" width="12" height="6" fill="#4682B4" rx="1"/>
  
  <!-- Stick figures on beach -->
  <!-- Person 1 (taking photo) -->
  <circle cx="80" cy="210" r="8" fill="#FFDBAC" stroke="#000" stroke-width="1"/>
  <line x1="80" y1="218" x2="80" y2="250" stroke="#000" stroke-width="2"/>
  <line x1="80" y1="230" x2="65" y2="225" stroke="#000" stroke-width="2"/>
  <line x1="80" y1="230" x2="95" y2="235" stroke="#000" stroke-width="2"/>
  <line x1="80" y1="250" x2="70" y2="270" stroke="#000" stroke-width="2"/>
  <line x1="80" y1="250" x2="90" y2="270" stroke="#000" stroke-width="2"/>
  <!-- Hair -->
  <path d="M 72 205 Q 80 195 88 205" fill="#8B4513" stroke="#000" stroke-width="1"/>
  <!-- Smile -->
  <path d="M 76 212 Q 80 215 84 212" fill="none" stroke="#000" stroke-width="1"/>
  <!-- Camera -->
  <rect x="95" y="233" width="8" height="5" fill="#000" rx="1"/>
  <circle cx="99" cy="235" r="1" fill="#87CEEB"/>
  
  <!-- Person 2 (pointing at seal) -->
  <circle cx="220" cy="210" r="8" fill="#FFDBAC" stroke="#000" stroke-width="1"/>
  <line x1="220" y1="218" x2="220" y2="250" stroke="#000" stroke-width="2"/>
  <line x1="220" y1="230" x2="205" y2="235" stroke="#000" stroke-width="2"/>
  <line x1="220" y1="230" x2="240" y2="220" stroke="#000" stroke-width="2"/>
  <line x1="220" y1="250" x2="210" y2="270" stroke="#000" stroke-width="2"/>
  <line x1="220" y1="250" x2="230" y2="270" stroke="#000" stroke-width="2"/>
  <!-- Hair -->
  <path d="M 212 205 Q 220 195 228 205" fill="#654321" stroke="#000" stroke-width="1"/>
  <!-- Smile -->
  <path d="M 216 212 Q 220 215 224 212" fill="none" stroke="#000" stroke-width="1"/>
  
  <!-- Seal on beach -->
  <ellipse cx="260" cy="245" rx="15" ry="8" fill="#696969"/>
  <ellipse cx="260" cy="235" rx="8" ry="6" fill="#696969"/>
  <!-- Seal face -->
  <circle cx="257" cy="232" r="1" fill="#000"/>
  <circle cx="263" cy="232" r="1" fill="#000"/>
  <ellipse cx="260" cy="237" rx="2" ry="1" fill="#000"/>
  <!-- Whiskers -->
  <line x1="252" y1="235" x2="248" y2="235" stroke="#000" stroke-width="0.5"/>
  <line x1="268" y1="235" x2="272" y2="235" stroke="#000" stroke-width="0.5"/>
  <line x1="253" y1="238" x2="249" y2="239" stroke="#000" stroke-width="0.5"/>
  <line x1="267" y1="238" x2="271" y2="239" stroke="#000" stroke-width="0.5"/>
  <!-- Flippers -->
  <ellipse cx="270" cy="248" rx="4" ry="2" fill="#696969" transform="rotate(30 270 248)"/>
  <ellipse cx="250" cy="248" rx="4" ry="2" fill="#696969" transform="rotate(-30 250 248)"/>
  
  <!-- Ocean waves -->
  <path d="M 0 170 Q 50 165 100 170 Q 150 175 200 170 Q 250 165 300 170" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M 0 185 Q 75 180 150 185 Q 225 190 300 185" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  <path d="M 0 200 Q 100 195 200 200 Q 250 205 300 200" fill="none" stroke="#FFFFFF" stroke-width="1"/>
  
  <!-- Beach items -->
  <!-- Towel -->
  <rect x="40" y="240" width="30" height="15" fill="#FF69B4" rx="2"/>
  <rect x="42" y="242" width="26" height="3" fill="#FFFFFF"/>
  <rect x="42" y="250" width="26" height="3" fill="#FFFFFF"/>
  
  <!-- Cooler -->
  <rect x="190" y="245" width="15" height="10" fill="#4682B4" rx="1"/>
  <rect x="192" y="247" width="3" height="6" fill="#C0C0C0"/>
  
  <!-- Seagulls -->
  <path d="M 100 120 Q 105 115 110 120" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M 105 120 Q 110 115 115 120" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  
  <path d="M 180 110 Q 185 105 190 110" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <path d="M 185 110 Q 190 105 195 110" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  
  <!-- Sun -->
  <circle cx="50" cy="50" r="20" fill="#FFD700"/>
  <line x1="50" y1="20" x2="50" y2="10" stroke="#FFD700" stroke-width="3"/>
  <line x1="80" y1="50" x2="90" y2="50" stroke="#FFD700" stroke-width="3"/>
  <line x1="50" y1="80" x2="50" y2="90" stroke="#FFD700" stroke-width="3"/>
  <line x1="20" y1="50" x2="10" y2="50" stroke="#FFD700" stroke-width="3"/>
  <line x1="71" y1="29" x2="78" y2="22" stroke="#FFD700" stroke-width="3"/>
  <line x1="71" y1="71" x2="78" y2="78" stroke="#FFD700" stroke-width="3"/>
  <line x1="29" y1="71" x2="22" y2="78" stroke="#FFD700" stroke-width="3"/>
  <line x1="29" y1="29" x2="22" y2="22" stroke="#FFD700" stroke-width="3"/>
  
  <!-- Clouds -->
  <circle cx="200" cy="40" r="8" fill="#FFFFFF"/>
  <circle cx="210" cy="40" r="10" fill="#FFFFFF"/>
  <circle cx="220" cy="40" r="8" fill="#FFFFFF"/>
  
  <circle cx="250" cy="60" r="6" fill="#FFFFFF"/>
  <circle cx="258" cy="60" r="8" fill="#FFFFFF"/>
  <circle cx="266" cy="60" r="6" fill="#FFFFFF"/>
  
  <!-- Hearts above the couple -->
  <path d="M 145 190 Q 147 188 149 190 Q 151 188 153 190 Q 151 194 149 196 Q 147 194 145 190" fill="#FF69B4"/>
  
  <!-- Beach grass -->
  <line x1="25" y1="240" x2="27" y2="225" stroke="#228B22" stroke-width="2"/>
  <line x1="30" y1="242" x2="32" y2="227" stroke="#228B22" stroke-width="2"/>
  <line x1="275" y1="240" x2="277" y2="225" stroke="#228B22" stroke-width="2"/>
  <line x1="280" y1="242" x2="282" y2="227" stroke="#228B22" stroke-width="2"/>
</svg>
