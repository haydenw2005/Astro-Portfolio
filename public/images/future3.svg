<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect width="300" height="150" fill="#87CEEB"/>
  
  <!-- Ground -->
  <rect y="150" width="300" height="150" fill="#90EE90"/>
  
  <!-- Airplane -->
  <ellipse cx="80" cy="80" rx="25" ry="5" fill="#C0C0C0"/>
  <polygon points="55,80 45,75 45,85" fill="#C0C0C0"/>
  <rect x="70" y="75" width="20" height="10" fill="#87CEEB"/>
  <line x1="65" y1="80" x2="55" y2="85" stroke="#C0C0C0" stroke-width="3"/>
  <line x1="95" y1="80" x2="105" y2="75" stroke="#C0C0C0" stroke-width="3"/>
  
  <!-- Travel clouds -->
  <circle cx="120" cy="50" r="6" fill="#FFFFFF"/>
  <circle cx="128" cy="50" r="8" fill="#FFFFFF"/>
  <circle cx="136" cy="50" r="6" fill="#FFFFFF"/>
  
  <!-- Stick figure couple with backpacks -->
  <!-- Person 1 (with camera) -->
  <circle cx="80" cy="200" r="8" fill="#FFDBAC" stroke="#000" stroke-width="1"/>
  <line x1="80" y1="208" x2="80" y2="240" stroke="#000" stroke-width="2"/>
  <line x1="80" y1="220" x2="65" y2="210" stroke="#000" stroke-width="2"/>
  <line x1="80" y1="220" x2="95" y2="215" stroke="#000" stroke-width="2"/>
  <line x1="80" y1="240" x2="70" y2="260" stroke="#000" stroke-width="2"/>
  <line x1="80" y1="240" x2="90" y2="260" stroke="#000" stroke-width="2"/>
  <!-- Hair -->
  <path d="M 72 195 Q 80 185 88 195" fill="#8B4513" stroke="#000" stroke-width="1"/>
  <!-- Smile -->
  <path d="M 76 202 Q 80 205 84 202" fill="none" stroke="#000" stroke-width="1"/>
  <!-- Backpack -->
  <rect x="85" y="210" width="8" height="12" fill="#8B4513" rx="2"/>
  <circle cx="89" cy="213" r="1" fill="#FFD700"/>
  <!-- Camera -->
  <rect x="95" y="213" width="6" height="4" fill="#000" rx="1"/>
  <circle cx="98" cy="215" r="1" fill="#87CEEB"/>
  
  <!-- Person 2 (with map) -->
  <circle cx="220" cy="200" r="8" fill="#FFDBAC" stroke="#000" stroke-width="1"/>
  <line x1="220" y1="208" x2="220" y2="240" stroke="#000" stroke-width="2"/>
  <line x1="220" y1="220" x2="205" y2="215" stroke="#000" stroke-width="2"/>
  <line x1="220" y1="220" x2="235" y2="210" stroke="#000" stroke-width="2"/>
  <line x1="220" y1="240" x2="210" y2="260" stroke="#000" stroke-width="2"/>
  <line x1="220" y1="240" x2="230" y2="260" stroke="#000" stroke-width="2"/>
  <!-- Hair -->
  <path d="M 212 195 Q 220 185 228 195" fill="#654321" stroke="#000" stroke-width="1"/>
  <!-- Smile -->
  <path d="M 216 202 Q 220 205 224 202" fill="none" stroke="#000" stroke-width="1"/>
  <!-- Backpack -->
  <rect x="225" y="210" width="8" height="12" fill="#4682B4" rx="2"/>
  <circle cx="229" cy="213" r="1" fill="#FFD700"/>
  <!-- Map -->
  <rect x="200" y="213" width="8" height="6" fill="#F5DEB3" stroke="#000" stroke-width="0.5"/>
  <line x1="202" y1="215" x2="206" y2="215" stroke="#000" stroke-width="0.5"/>
  <line x1="202" y1="217" x2="206" y2="217" stroke="#000" stroke-width="0.5"/>
  
  <!-- World landmarks -->
  <!-- Eiffel Tower -->
  <line x1="150" y1="200" x2="150" y2="140" stroke="#8B4513" stroke-width="3"/>
  <line x1="150" y1="160" x2="145" y2="170" stroke="#8B4513" stroke-width="2"/>
  <line x1="150" y1="160" x2="155" y2="170" stroke="#8B4513" stroke-width="2"/>
  <line x1="150" y1="180" x2="142" y2="190" stroke="#8B4513" stroke-width="2"/>
  <line x1="150" y1="180" x2="158" y2="190" stroke="#8B4513" stroke-width="2"/>
  <line x1="145" y1="170" x2="155" y2="170" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Pyramid -->
  <polygon points="50,200 30,200 40,170" fill="#DEB887" stroke="#8B4513" stroke-width="1"/>
  <line x1="40" y1="170" x2="40" y2="185" stroke="#8B4513" stroke-width="1"/>
  <line x1="35" y1="190" x2="45" y2="190" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Statue of Liberty -->
  <line x1="270" y1="200" x2="270" y2="160" stroke="#228B22" stroke-width="2"/>
  <circle cx="270" cy="155" r="3" fill="#FFDBAC"/>
  <line x1="270" y1="158" x2="275" y2="150" stroke="#FFD700" stroke-width="2"/>
  <polygon points="268,150 270,145 272,150" fill="#FFD700"/>
  <rect x="268" y="170" width="4" height="20" fill="#228B22"/>
  
  <!-- Leaning Tower of Pisa -->
  <line x1="180" y1="200" x2="185" y2="140" stroke="#C0C0C0" stroke-width="4"/>
  <circle cx="182" cy="150" r="2" fill="#C0C0C0"/>
  <circle cx="183" cy="165" r="2" fill="#C0C0C0"/>
  <circle cx="184" cy="180" r="2" fill="#C0C0C0"/>
  
  <!-- Travel path (dotted line) -->
  <path d="M 50 180 Q 100 120 150 160 Q 200 100 270 180" fill="none" stroke="#FF69B4" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Hearts along the path -->
  <path d="M 90 140 Q 92 138 94 140 Q 96 138 98 140 Q 96 144 94 146 Q 92 144 90 140" fill="#FF69B4"/>
  <path d="M 180 130 Q 182 128 184 130 Q 186 128 188 130 Q 186 134 184 136 Q 182 134 180 130" fill="#FF69B4"/>
  <path d="M 230 140 Q 232 138 234 140 Q 236 138 238 140 Q 236 144 234 146 Q 232 144 230 140" fill="#FF69B4"/>
  
  <!-- Suitcases -->
  <rect x="110" y="245" width="12" height="8" fill="#8B4513" rx="1"/>
  <circle cx="116" cy="249" r="1" fill="#FFD700"/>
  <line x1="116" y1="245" x2="116" y2="247" stroke="#000" stroke-width="1"/>
  
  <rect x="190" y="248" width="10" height="6" fill="#4682B4" rx="1"/>
  <circle cx="195" cy="251" r="0.5" fill="#FFD700"/>
  <line x1="195" y1="248" x2="195" y2="250" stroke="#000" stroke-width="0.5"/>
  
  <!-- Sun -->
  <circle cx="250" cy="50" r="15" fill="#FFD700"/>
  <line x1="250" y1="25" x2="250" y2="15" stroke="#FFD700" stroke-width="2"/>
  <line x1="275" y1="50" x2="285" y2="50" stroke="#FFD700" stroke-width="2"/>
  <line x1="250" y1="75" x2="250" y2="85" stroke="#FFD700" stroke-width="2"/>
  <line x1="225" y1="50" x2="215" y2="50" stroke="#FFD700" stroke-width="2"/>
  <line x1="268" y1="32" x2="275" y2="25" stroke="#FFD700" stroke-width="2"/>
  <line x1="268" y1="68" x2="275" y2="75" stroke="#FFD700" stroke-width="2"/>
  <line x1="232" y1="68" x2="225" y2="75" stroke="#FFD700" stroke-width="2"/>
  <line x1="232" y1="32" x2="225" y2="25" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Passport stamps -->
  <circle cx="30" cy="30" r="8" fill="none" stroke="#FF0000" stroke-width="1"/>
  <text x="30" y="35" text-anchor="middle" font-size="6" fill="#FF0000">FR</text>
  
  <circle cx="60" cy="25" r="8" fill="none" stroke="#0000FF" stroke-width="1"/>
  <text x="60" y="30" text-anchor="middle" font-size="6" fill="#0000FF">IT</text>
</svg> 